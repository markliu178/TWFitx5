name: Release
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release 名称（留空则自动用 tag 名）'
        required: false
        default: ''
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
env:
  CI_NAME: Release CI
  # split only one ABI so the artifact stays small
  BUILD_ABI: arm64-v8a

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmake;4.1.2'

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v4
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-arm64-v8a-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        run: |
          cat << EOF > keystore.properties
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Trime
        run: make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trime-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Package source code
        id: package-source
        run: |
          # 打包源码（含 submodule），排除不必要的构建产物
          git archive --format=zip --output=source.zip HEAD
          # 如果有 submodule，把它们也加进去
          if [ -f .gitmodules ]; then
            cat .gitmodules | grep 'path' | awk -F'= ' '{print $2}' | while read submod; do
              if [ -d "$submod" ]; then
                (cd "$submod" && git archive --format=zip --prefix="$submod/" HEAD -o /tmp/submod.zip)
                python3 - << 'PYEOF'
          import zipfile
          with zipfile.ZipFile("source.zip", "a") as zf:
              with zipfile.ZipFile("/tmp/submod.zip") as sf:
                  for item in sf.infolist():
                      zf.writestr(item, sf.read(item.filename))
          PYEOF
              fi
            done
          fi
          echo "source_zip=$(pwd)/source.zip" >> "$GITHUB_OUTPUT"
          ls -lh source.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: trime-source
          path: source.zip
          if-no-files-found: error

      - name: Build changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          commitMode: true
          configurationJson: |
            {
              "template": "Change log from #{{FROM_TAG}} to #{{TO_TAG}}: #{{RELEASE_DIFF}}\n#{{UNCATEGORIZED}}",
              "pr_template": "- [#{{MERGE_SHA}}] - #{{TITLE}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=continuous-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            NAME="${{ github.event.inputs.release_name }}"
            if [ -z "$NAME" ]; then NAME="continuous-${GITHUB_SHA::7}"; fi
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || github.event.inputs.prerelease == 'true' }}
          body: |
            ${{ steps.build_changelog.outputs.changelog }}
            ---
            **构建信息**
            - Commit: \`${{ github.sha }}\`
            - Runner: ${{ runner.os }}
          files: |
            app/build/outputs/apk/release/*.apk
            source.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
